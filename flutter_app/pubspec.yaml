name: vibesight_tracker
description: "Vibesight Tracker — Flutter port. Финансовая грамотность, бюджет, привычки, тренировки и продуктивность."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0

  # Charts
  fl_chart: ^0.69.2

  # Local notifications (Phase 2.5: habit/task reminders)
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  flutter_timezone: ^3.0.1

  # Phase 3: photo notes for goals/spheres
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0

  # Phase 4.5: pose tracking + AI workout generator
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.13.0
  http: ^1.2.2

  # Receipts: OCR scanning of paper checks
  google_mlkit_text_recognition: ^0.14.0

  # Phase 8: Passwords & TOTP
  crypto: ^3.0.6

  # Encryption-at-rest for the password vault (platform Keystore / Keychain)
  flutter_secure_storage: ^9.2.2

  # Data safety: ZIP-archive backup with media files alongside Hive JSON
  archive: ^3.6.1

  # Phase 13: open YouTube/article links + JSON backup file picker
  url_launcher: ^6.3.1
  file_picker: ^8.1.4
  share_plus: ^10.1.2

  # Phase 14: visual wow — animations, skeletons, swipe actions, dynamic theme
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.2
  dynamic_color: ^1.7.0

  # Phase 14: PDF / CSV export of financial plan and transactions
  pdf: ^3.11.1
  printing: ^5.13.4
  csv: ^6.0.0

  # Phase 14: QR scanning of Belarusian fiscal receipts
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Phase 14: biometric lock + voice notes
  local_auth: ^2.3.0
  speech_to_text: ^7.0.0

  # Wave 2: AI ecosystem — markdown rendering for LLM responses
  flutter_markdown: ^0.7.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
